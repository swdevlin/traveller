<!doctype html>

<html lang="en">

  <head>

    <title>Something went wrong (500) · Traveller Universe</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      body {
        background: #020617;
        color: #cbd5e1;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        min-height: 100dvh;
        padding: 1.5rem;
        place-items: center;
        -webkit-font-smoothing: antialiased;
      }

      main {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 0.5rem;
        max-width: 34rem;
        padding: 2.5rem 2rem;
        text-align: center;
        width: 100%;
      }

      .code {
        color: #ff5c57;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        color: #f1f5f9;
        font-size: 1.75rem;
        margin: 0.75rem 0 1rem;
      }

      p {
        color: #cbd5e1;
        margin-bottom: 0.75rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin: 1.75rem 0 1.25rem;
      }

      .button {
        border: 1px solid #94a3b8;
        border-radius: 0.375rem;
        color: #f1f5f9;
        cursor: pointer;
        background: transparent;
        font: inherit;
        padding: 0.5rem 1.1rem;
        text-decoration: none;
      }

      .button:hover, .button:focus-visible {
        border-color: #f1f5f9;
        text-decoration: underline;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/500.html -->

    <main>
      <div class="code">Error 500</div>
      <h1>Something went wrong on our end</h1>
      <p>The system hit an unexpected fault while handling your request. Nothing you did caused it, and your data has not been affected.</p>

      <div class="actions">
        <a class="button" href="javascript:history.back()">Go back</a>
        <a class="button" href="/">Home</a>
      </div>
    </main>

  </body>

</html>
