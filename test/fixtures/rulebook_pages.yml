core_page_starships:
  rulebook: core
  pdf_page_number: 1
  heading: Starships
  body: |
    CORE RULEBOOK

    Chapter 3: Starships

    Every starship requires a jump drive to travel faster than light. The jump drive
    consumes fuel proportional to jump distance and hull tonnage. Without a jump drive,
    a hull cannot make a jump. Every jump drive must be maintained; a fouled jump drive
    strands the vessel between systems. A jump drive is rated by jump number, and a
    higher-rated jump drive draws more power per jump. No two shipyards install a jump
    drive quite the same way, and a mismatched jump drive can shake a hull apart. A
    well-tuned jump drive lasts decades; a neglected jump drive fails mid-transit.
  normalized_body: |
