hidden_page_one:
  rulebook: hidden
  pdf_page_number: 1
  heading: Secret Jump Drive Variants
  body: |
    Secret rules about jump drive variants for the hidden sourcebook. A modified jump drive
    behaves differently from a standard jump drive under these house rules. No two black-market
    jump drive conversions behave alike, and a black-market jump drive voids the warranty. A
    smuggler's jump drive is rarely registered, and an unregistered jump drive draws suspicion.
  normalized_body: |
