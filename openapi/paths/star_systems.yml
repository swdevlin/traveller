    operationId: getStarSystemPassengerTraffic
    tags: [Star systems]
    summary: Passenger DMs for one system
    description: A system's UWP and the DMs it contributes to passenger traffic. The caller must be the owner of the campaign.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/StarSystemId' }
    responses:
      '200':
        description: The system's data.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficSystem' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/StarSystemNotFound' }
