# Paths: Star systems
/starsystem:
  get:
    operationId: getStarSystemAtHex
    tags: [Star systems]
    summary: Get the star system at a sector hex
    description: |
      Looks a system up by sector and hex position. `hx` and `hy` are the
      hex's column and row within the sector (1-32 and 1-40). The `parsec`
      is always returned; `star_system` is `null` when the hex is empty.
    parameters:
      - { name: sx, in: query, required: true, description: Sector x., schema: { type: integer } }
      - { name: sy, in: query, required: true, description: Sector y., schema: { type: integer } }
      - { name: hx, in: query, required: true, description: Hex column within the sector., schema: { type: integer } }
      - { name: hy, in: query, required: true, description: Hex row within the sector., schema: { type: integer } }
    responses:
      '200':
        description: The hex's parsec and, if it has one, its star system.
        content:
          application/json:
            schema:
              type: object
              required: [star_system, parsec]
              properties:
                star_system:
                  oneOf:
                    - { $ref: '#/components/schemas/StarSystemDetail' }
                    - { type: 'null' }
                parsec:
                  type: object
                  required: [id, survey_index]
                  properties:
                    id: { type: integer }
                    survey_index: { type: [integer, 'null'] }
      '400':
        description: One of `sx`, `sy`, `hx`, `hy` is missing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'sx, sy, hx, hy required' }
      '404':
        description: There is no such parsec.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'solar system not found' }
/star_systems:
  get:
    operationId: findStarSystems
    tags: [Star systems]
    summary: Find star systems
    description: |
      Finds systems from text someone typed, for search boxes and pickers. The
      query `q` is read as one of:

      - **A name**, matched fuzzily against system names. If no system
        matches, it is matched against sector names and the systems of the
        matching sector are returned.
      - **A hex code** of 1 to 4 digits, such as `1910`. Fewer than four digits
        match every hex that starts with them.
      - **A name and a hex code**, such as `Spinward 1910`: the system at that
        hex in a sector with that name, as well as systems with that name.

      A system with no name is shown as its sector and hex, such as
      `Spinward Marches 1910`. At most 12 results are returned, best match
      first. A `q` of fewer than three characters returns an empty list.

      Players see only systems that are known or have a survey index of at
      least 10. The referee, with the API token, sees every system.
    parameters:
      - { $ref: '#/components/parameters/Query' }
      - name: sector_id
        in: query
        description: Only return systems in this sector.
        schema: { type: integer }
    responses:
      '200':
        description: Matching systems, best match first.
        content:
          application/json:
            schema:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/StarSystemMatch' }
            example:
              - { id: 4021, name: Zeta Prime, meta: 'Spinward Marches · 1910' }
      '400':
        description: '`sector_id` is not a whole number.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'sector_id must be a whole number' }
/star_systems/{id}:
  get:
    operationId: getStarSystem
    tags: [Star systems]
    summary: Get a star system
    description: |
      The full star system with its stars and the bodies orbiting them.
      Details the players have not discovered are withheld: unless the
      system is known or its survey index is at least 10, the response omits
      survey records, bases, trade codes and similar fields.
    parameters:
      - { $ref: '#/components/parameters/Id' }
    responses:
      '200':
        description: The star system.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarSystemDetail' }
      '404':
        description: No star system has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'star system not found' }
  patch:
    operationId: updateStarSystem
    tags: [Star systems]
    summary: Update a star system
    description: |
      Renames the system and sets whether the players know it and its survey
      index. Only the fields sent are changed. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              known: { type: boolean }
              survey_index: { type: integer }
    responses:
      '200':
        description: The system's values after the update.
        content:
          application/json:
            schema:
              type: object
              required: [name, known, survey_index]
              properties:
                name: { type: [string, 'null'] }
                known: { type: boolean }
                survey_index: { type: [integer, 'null'] }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: No star system has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'star system not found' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
/star_systems/{id}/ship_traffic:
  get:
    operationId: getStarSystemShipTraffic
    tags: [Star systems]
    summary: Daily ship traffic
    description: Estimates the number of ships arriving each day at the system's main world.
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: frontier
        in: query
        description: Pass `1` to treat the system as a frontier world.
        schema: { type: string, enum: ['1'] }
    responses:
      '200':
        description: The traffic estimate.
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { description: The calculated traffic. }
                effective_importance: { type: [integer, 'null'] }
                tier_label: { type: [string, 'null'] }
                modifiers: { description: The DMs applied. }
      '404':
        description: No star system has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'star system not found' }
      '422':
        description: The system has no main world.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'no main world' }
/stars/{id}/orbit_map:
  get:
    operationId: getStarOrbitMapSvg
    tags: [Star systems]
    summary: Orbit map (SVG)
    description: |
      A diagram of the star's orbits, as SVG by default (a `.svg` suffix is
      also accepted). Here `id` is a **star** id. Requires authentication.
      An SVG fetched with the API token contains no hyperlinks, so it can be
      embedded in other sites and tools.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/OrbitMapTheme' }
      - { $ref: '#/components/parameters/OrbitMapDownload' }
    responses:
      '200':
        description: The orbit map.
        content:
          image/svg+xml:
            schema: { type: string }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: No star has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'star not found' }
/stars/{id}/orbit_map.webp:
  get:
    operationId: getStarOrbitMapWebp
    tags: [Star systems]
    summary: Orbit map (WebP)
    description: The same diagram as a WebP image. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/OrbitMapTheme' }
      - { $ref: '#/components/parameters/OrbitMapDownload' }
    responses:
      '200':
        description: The orbit map.
        content:
          image/webp:
            schema: { type: string, format: binary }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: No star has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

            example: { error: 'star not found' }