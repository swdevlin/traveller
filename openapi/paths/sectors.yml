# Paths: Sectors
/sectors:
  get:
    operationId: listSectors
    tags: [Sectors]
    summary: List sectors
    description: |
      Returns every sector in the campaign with its subsectors. `tags` are
      empty unless the request has referee access.
    responses:
      '200':
        description: The campaign's sectors.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Sector' }
      '404': { $ref: '#/components/responses/CampaignNotFound' }
/subsectors/{id}:
  get:
    operationId: getSubsector
    tags: [Sectors]
    summary: Get a subsector
    description: A subsector with its parent sector and a summary of each star system in it.
    parameters:
      - { $ref: '#/components/parameters/Id' }
    responses:
      '200':
        description: The subsector.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Subsector' }
      '404':
        description: No subsector has this id, or the campaign does not exist.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'subsector not found' }
/subsector_at:
  get:
    operationId: getSubsectorAt
    tags: [Sectors]
    summary: Find the subsector at a coordinate
    description: Returns the campaign path of the subsector containing a parsec.
    parameters:
      - name: x
        in: query
        required: true
        description: Universal x coordinate.
        schema: { type: integer }
      - name: y
        in: query
        required: true
        description: Universal y coordinate.
        schema: { type: integer }
    responses:
      '200':
        description: The path of the subsector's page on the site.
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  examples: [/c/my-campaign/subsectors/42]
      '404':
        description: There is no subsector at this coordinate.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'No subsector at this point' }
/parsecs:
  get:
    operationId: listParsecs
    tags: [Sectors]
    summary: List a sector's parsecs
    parameters:
      - name: sector_id
        in: query
        required: true
        description: The sector's id.
        schema: { type: integer }
    responses:
      '200':
        description: Parsecs ordered by x, then y descending.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ParsecSummary' }
/parsecs/lookup:
  get:
    operationId: lookupParsec
    tags: [Sectors]
    summary: Look up what is at a hex
    description: |
      Finds a hex by sector and hex position and returns its parsec, with the
      star system in it nested as `star_system`, or `null` if the hex is
      empty. `hx` and `hy` are the hex's column and row within the sector (1-32
      and 1-40). Details of the system that the players have not discovered are
      withheld, as for `GET /star_systems/{id}`.

      The response has an `ETag`. Send it back as `If-None-Match` to get `304`
      with no body while the hex and its system are unchanged.
    parameters:
      - { name: sx, in: query, required: true, description: Sector x., schema: { type: integer } }
      - { name: sy, in: query, required: true, description: Sector y., schema: { type: integer } }
      - { name: hx, in: query, required: true, description: Hex column within the sector., schema: { type: integer } }
      - { name: hy, in: query, required: true, description: Hex row within the sector., schema: { type: integer } }
      - { $ref: '#/components/parameters/IfNoneMatch' }
    responses:
      '200':
        description: The hex's parsec and, if it has one, its star system.
        headers:
          ETag: { description: Identifies this version of the response, when the hex has a star system., schema: { type: string } }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Parsec' }
      '304': { $ref: '#/components/responses/NotModified' }
      '400':
        description: One of `sx`, `sy`, `hx`, `hy` is missing.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'sx, sy, hx, hy required' }
      '404':
        description: There is no such parsec.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'parsec not found' }
/parsecs/{id}:
  patch:
    operationId: updateParsec
    tags: [Sectors]
    summary: Update a parsec
    description: Sets the parsec's survey index. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              survey_index: { type: integer }
    responses:
      '200':
        description: The parsec was updated.
        content:
          application/json:
            schema:
              type: object
              required: [survey_index]
              properties:
                survey_index: { type: [integer, 'null'] }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404':
        description: No parsec has this id.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: 'parsec not found' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
/regions:
  get:
    operationId: listRegions
    tags: [Sectors]
    summary: List regions in a viewport
    description: |
      Regions (political or cultural areas) that touch the viewport, with the
      hexes they cover within it. The viewport is padded by one hex.
    parameters:
      - { $ref: '#/components/parameters/Sx' }
      - { $ref: '#/components/parameters/Sy' }
      - { $ref: '#/components/parameters/Ulx' }
      - { $ref: '#/components/parameters/Uly' }
      - { $ref: '#/components/parameters/Lrx' }
      - { $ref: '#/components/parameters/Lry' }
    responses:
      '200':
        description: Regions in the viewport.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Region' }
      '400': { $ref: '#/components/responses/ViewportRequired' }
