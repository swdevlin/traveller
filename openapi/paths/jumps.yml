# Paths: Jumps
/jumps:
  get:
    operationId: listJumps
    tags: [Jumps]
    summary: List jump logs
    description: All logged jumps, oldest arrival first. `notes` is returned only to the referee.
    responses:
      '200':
        description: Jump logs.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/JumpLogEntry' }
  post:
    operationId: createJump
    tags: [Jumps]
    summary: Log a jump
    description: Requires authentication. Raises the destination's survey index where appropriate.
    security: [{ bearerToken: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JumpLogInput' }
    responses:
      '201':
        description: The jump was logged.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JumpLog' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
/jumps/{id}:
  patch:
    operationId: updateJump
    tags: [Jumps]
    summary: Update a jump
    description: Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JumpLogInput' }
    responses:
      '200':
        description: The updated jump.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JumpLog' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
  delete:
    operationId: deleteJump
    tags: [Jumps]
    summary: Delete a jump
    description: |
      Requires authentication. Only a ship's most recent jump can be deleted,
      so that its route has no gap.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    responses:
      '204':
        description: The jump was deleted.
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
