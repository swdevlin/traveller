# Paths: Jumps
/jumps:
  get:
    operationId: listJumps
    tags: [Jumps]
    summary: List jump logs
    description: All logged jumps, oldest arrival first. `notes` is returned only to the referee.
    responses:
      '200':
        description: Jump logs.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/JumpLogEntry' }
  post:
    operationId: createJump
    tags: [Jumps]
    summary: Log a jump
    description: Requires authentication. Raises the destination's survey index where appropriate.
    security: [{ bearerToken: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JumpLogInput' }
    responses:
      '201':
        description: The jump was logged.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JumpLog' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
/jumps/{id}:
  patch:
    operationId: updateJump
    tags: [Jumps]
    summary: Update a jump
    description: Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JumpLogInput' }
    responses:
      '200':
        description: The updated jump.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JumpLog' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
  delete:
    operationId: deleteJump
    tags: [Jumps]
    summary: Delete a jump
    description: |
      Requires authentication. Only a ship's most recent jump can be deleted,
      so that its route has no gap.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/Id' }
    responses:
      '204':
        description: The jump was deleted.
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationErrors' }
/ships:
  get:
    operationId: listShips
    tags: [Jumps]
    summary: List ships
    responses:
      '200':
        description: Ships, ordered by name.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [id, name, jump_drive]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  jump_drive: { type: [integer, 'null'], description: The ship's jump rating. }
/ships/{id}/last_jump:
  get:
    operationId: getShipLastJump
    tags: [Jumps]
    summary: A ship's most recent jump
    description: Where the ship last arrived. The body is `null` if the ship has not jumped.
    parameters:
      - { $ref: '#/components/parameters/Id' }
    responses:
      '200':
        description: The last jump, or `null`.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [parsec_id, sector_id, arrive_year, arrive_day]
                  properties:
                    parsec_id: { type: integer }
                    sector_id: { type: integer }
                    arrive_year: { type: [integer, 'null'] }
                    arrive_day: { type: [integer, 'null'] }
                - { type: 'null' }
