# Paths: Commerce
/passenger_traffic:
  get:
    operationId: calculatePassengerTraffic
    tags: [Commerce]
    summary: Passenger traffic between two systems
    description: Rolls the passengers available in each class. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/FromId' }
      - { $ref: '#/components/parameters/ToId' }
      - { $ref: '#/components/parameters/BrokerEffect' }
      - { name: chief_steward_skill, in: query, description: 'Chief Steward skill level, applied as a DM.', schema: { type: integer, default: 0 } }
      - { $ref: '#/components/parameters/RefereeModifier' }
    responses:
      '200':
        description: The traffic roll.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PassengerTraffic' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/TwoSystemsRequired' }
/passenger_traffic/system:
  get:
    operationId: getPassengerTrafficSystem
    tags: [Commerce]
    summary: Passenger DMs for one system
    description: A system's UWP and the DMs it contributes to passenger traffic. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/SystemId' }
    responses:
      '200':
        description: The system's data.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficSystem' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/SystemRequired' }
/freight_traffic:
  get:
    operationId: calculateFreightTraffic
    tags: [Commerce]
    summary: Freight traffic between two systems
    description: Rolls the freight lots available. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/FromId' }
      - { $ref: '#/components/parameters/ToId' }
      - { $ref: '#/components/parameters/BrokerEffect' }
      - { $ref: '#/components/parameters/RefereeModifier' }
    responses:
      '200':
        description: The freight roll.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreightTraffic' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/TwoSystemsRequired' }
/freight_traffic/system:
  get:
    operationId: getFreightTrafficSystem
    tags: [Commerce]
    summary: Freight DMs for one system
    description: Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/SystemId' }
    responses:
      '200':
        description: The system's data.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficSystem' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/SystemRequired' }
/mail_traffic:
  get:
    operationId: calculateMailTraffic
    tags: [Commerce]
    summary: Mail between two systems
    description: Rolls the mail containers available. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/FromId' }
      - { $ref: '#/components/parameters/ToId' }
      - { name: ship_armed, in: query, description: Whether the ship is armed., schema: { type: boolean } }
      - { name: naval_or_scout_rank, in: query, description: Naval or Scout service rank., schema: { type: integer, default: 0 } }
      - { name: soc_dm, in: query, description: DM from Social Standing., schema: { type: integer, default: 0 } }
      - { $ref: '#/components/parameters/RefereeModifier' }
    responses:
      '200':
        description: The mail roll.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailTraffic' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/TwoSystemsRequired' }
/mail_traffic/system:
  get:
    operationId: getMailTrafficSystem
    tags: [Commerce]
    summary: Mail DMs for one system
    description: Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/SystemId' }
    responses:
      '200':
        description: The system's data.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficSystem' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/SystemRequired' }
/trade_goods/availability:
  get:
    operationId: getTradeGoodsAvailability
    tags: [Commerce]
    summary: Goods available for purchase
    description: |
      Rolls the goods on offer at a system. Keep the returned `seed` and send
      it back to get the same list again; omit it to roll a new one. Requires
      authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/SystemId' }
      - name: seed
        in: query
        description: Seed from an earlier response, to repeat that roll.
        schema: { type: integer }
    responses:
      '200':
        description: The available goods.
        content:
          application/json:
            schema:
              type: object
              required: [system, seed, goods]
              properties:
                system: { $ref: '#/components/schemas/SystemRef' }
                trade_codes:
                  type: array
                  items: { type: string }
                population: { type: [integer, 'null'] }
                seed: { type: integer }
                goods:
                  type: array
                  items: { type: object, additionalProperties: true }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/SystemRequired' }
/trade_goods/prices:
  get:
    operationId: getTradeGoodsPrices
    tags: [Commerce]
    summary: Purchase or sale prices
    description: |
      Rolls the price of each requested good, or of every priceable good if
      `d66s` is omitted. Requires authentication.
    security: [{ bearerToken: [] }]
    parameters:
      - { $ref: '#/components/parameters/SystemId' }
      - name: direction
        in: query
        description: Whether the goods are being bought or sold.
        schema: { type: string, enum: [purchase, sale] }
      - { name: skill_effect, in: query, description: Skill Effect of the roll., schema: { type: integer, default: 0 } }
      - { name: counterpart_broker_skill, in: query, description: The other party's Broker skill., schema: { type: integer, default: 2 } }
      - { name: other_dm, in: query, description: Any other DM., schema: { type: integer, default: 0 } }
      - { name: use_broker, in: query, description: Whether a local broker is used., schema: { type: boolean } }
      - { name: broker_level, in: query, description: Broker skill level. Defaults to the campaign's setting., schema: { type: integer } }
      - { name: broker_fee_percentage, in: query, description: Broker fee. Defaults to the campaign's setting., schema: { type: number } }
      - name: d66s[]
        in: query
        description: D66 codes of the goods to price.
        style: form
        explode: true
        schema: { type: array, items: { type: integer } }
    responses:
      '200':
        description: The prices.
        content:
          application/json:
            schema:
              type: object
              required: [system, results]
              properties:
                system: { $ref: '#/components/schemas/SystemRef' }
                direction: { type: [string, 'null'] }
                skill_effect: { type: integer }
                counterpart_broker_skill: { type: integer }
                other_dm: { type: integer }
                use_broker: { type: [boolean, 'null'] }
                broker_level: { type: [integer, 'null'] }
                broker_fee_percentage: { type: [number, 'null'] }
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      d66: { type: integer }
                      name: { type: string }
                      modifiers: { description: The modifiers applied. }
                      result:
                        type: object
                        properties:
                          base_price: { type: [number, 'null'] }
                          percent: { type: [number, 'null'] }
                          price_per_ton: { type: [number, 'null'] }
                          net_price_per_ton: { type: [number, 'null'] }
                          fee_percentage: { type: [number, 'null'] }
                          qualifying_roll: { $ref: '#/components/schemas/Roll' }
      '401': { $ref: '#/components/responses/Unauthorised' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422':
        description: The system is unknown, or a parameter is invalid.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

            example: { error: 'id must reference a star system' }