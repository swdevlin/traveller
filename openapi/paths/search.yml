# Paths: Search
/search:
  get:
    operationId: search
    tags: [Search]
    summary: Search universe data
    description: |
      Fuzzy name search across star systems, stellar objects, sectors and
      subsectors, returning up to 12 results. Returns an empty list for
      queries shorter than three characters. Players see only known or
      surveyed systems. To find only star systems, including by hex code or
      within a sector, use `GET /star_systems`.
    parameters:
      - { $ref: '#/components/parameters/Query' }
    responses:
      '200':
        description: Matches, best first.
        content:
          application/json:
            schema:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/SearchResult' }
/rulebooks/search:
  get:
    operationId: searchRulebooks
    tags: [Search]
    summary: Search rulebooks
    description: |
      Full-text search of the campaign's rulebooks, grouped by rulebook.
      Referee-only material is included for the referee.
    parameters:
      - { $ref: '#/components/parameters/Query' }
      - name: rulebook_ids
        in: query
        description: Limit the search to these rulebooks, as a comma-separated list of IDs.
        style: form
        explode: false
        schema: { type: array, items: { type: integer } }
        example: [1, 2]
      - name: categories
        in: query
        description: Limit the search to rulebooks in these categories, as a comma-separated list.
        style: form
        explode: false
        schema: { type: array, items: { type: string } }
      - name: per_rulebook_limit
        in: query
        description: Hits to return per rulebook, 1 to 10.
        schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
    responses:
      '200':
        description: Results grouped by rulebook.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RulebookSearchGroup' }
