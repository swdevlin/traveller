# Schemas: ships
Ship:
  type: object
  required: [id, name, j_drive, m_drive]
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    j_drive: { type: [integer, 'null'], description: The ship's jump rating. }
    m_drive: { type: [integer, 'null'], description: The ship's manoeuvre drive rating, 0 to 10. }
ShipDetail:
  allOf:
    - $ref: '#/components/schemas/Ship'
    - type: object
      required: [last_jump]
      properties:
        last_jump:
          description: Where the ship last arrived, or `null` if it has not jumped.
          oneOf:
            - type: object
              description: A jump is both a departure and an arrival.
              required: [from_parsec_id, from_sector_id, from_star_system, to_parsec_id, to_sector_id, to_star_system, depart_year, depart_day, arrive_year, arrive_day, misjump]
              properties:
                from_parsec_id: { type: integer, description: Where the ship departed from. }
                from_sector_id: { type: integer }
                from_star_system: { $ref: '#/components/schemas/JumpStarSystem' }
                to_parsec_id: { type: integer, description: Where the ship arrived, which is where it is now. }
                to_sector_id: { type: integer }
                to_star_system: { $ref: '#/components/schemas/JumpStarSystem' }
                depart_year: { type: [integer, 'null'] }
                depart_day: { type: [integer, 'null'] }
                arrive_year: { type: [integer, 'null'] }
                arrive_day: { type: [integer, 'null'] }
                misjump: { type: boolean }
            - { type: 'null' }
JumpStarSystem:
  description: The star system in the parsec, or `null` if the parsec has none. A ship can jump to an empty parsec.
  oneOf:
    - type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
    - { type: 'null' }
