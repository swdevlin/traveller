# Schemas: sectors
Sector:
  type: object
  required: [id, name, x, y, abbreviation, tags, subsectors]
  allOf:
    - $ref: '#/components/schemas/Records'
    - type: object
      description: The `*_html` renders are not included in this response.
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: [integer, 'null'], description: 'Sector x coordinate, in the [universal coordinate](#description/universal-coordinates) system.' }
    y: { type: [integer, 'null'], description: 'Sector y coordinate, in the [universal coordinate](#description/universal-coordinates) system.' }
    abbreviation: { type: [string, 'null'] }
    tags: { $ref: '#/components/schemas/Tags' }
    subsectors:
      type: array
      items: { $ref: '#/components/schemas/SubsectorSummary' }
SubsectorSummary:
  type: object
  required: [id, name, x, y]
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: integer, description: Column within the sector, 1 to 4. }
    y: { type: integer, description: Row within the sector, 1 to 4. }
Subsector:
  type: object
  required: [id, name, x, y, letter, tags, sector, star_systems]
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: integer, description: Column within the sector, 1 to 4. }
    y: { type: integer, description: Row within the sector, 1 to 4. }
    letter: { type: string, description: 'The subsector''s letter, A to P.', examples: [A] }
    tags: { $ref: '#/components/schemas/Tags' }
    sector:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
    star_systems:
      type: array
      items: { $ref: '#/components/schemas/StarSystemListItem' }
