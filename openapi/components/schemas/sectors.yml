# Schemas: sectors
Sector:
  type: object
  required: [id, name, x, y, abbreviation, tags, subsectors]
  allOf:
    - $ref: '#/components/schemas/Records'
    - type: object
      description: The `*_html` renders are not included in this response.
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: [integer, 'null'], description: Universal sector x coordinate. }
    y: { type: [integer, 'null'], description: Universal sector y coordinate. }
    abbreviation: { type: [string, 'null'] }
    tags: { $ref: '#/components/schemas/Tags' }
    subsectors:
      type: array
      items: { $ref: '#/components/schemas/SubsectorSummary' }
SubsectorSummary:
  type: object
  required: [id, name, x, y]
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: integer, description: Column within the sector, 1 to 4. }
    y: { type: integer, description: Row within the sector, 1 to 4. }
Subsector:
  type: object
  required: [id, name, x, y, letter, tags, sector, star_systems]
  properties:
    id: { type: integer }
    name: { type: [string, 'null'] }
    x: { type: integer, description: Column within the sector, 1 to 4. }
    y: { type: integer, description: Row within the sector, 1 to 4. }
    letter: { type: string, description: 'The subsector''s letter, A to P.', examples: [A] }
    tags: { $ref: '#/components/schemas/Tags' }
    sector:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
    star_systems:
      type: array
      items: { $ref: '#/components/schemas/StarSystemListItem' }
ParsecSummary:
  type: object
  required: [id, hex_code, x, y]
  properties:
    id: { type: integer }
    hex_code: { type: [string, 'null'], description: 'Hex within the sector, such as `1910`.' }
    x: { type: integer }
    y: { type: integer }
    system_name: { type: [string, 'null'], description: The name of the star system in the parsec, if it has one. }
Parsec:
  type: object
  required: [id, hex_code, x, y, survey_index, star_system]
  properties:
    id: { type: integer }
    hex_code: { type: [string, 'null'], description: 'Hex within the sector, such as `1910`.' }
    x: { type: integer, description: Universal x coordinate. }
    y: { type: integer, description: Universal y coordinate. }
    survey_index: { type: [integer, 'null'], description: How thoroughly the hex has been surveyed, 0 to 12. }
    star_system:
      description: The star system in the parsec, or `null` if it is empty.
      oneOf:
        - { $ref: '#/components/schemas/StarSystemDetail' }
        - { type: 'null' }
