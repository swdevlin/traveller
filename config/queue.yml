default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Rulebook PDF imports run one at a time — each extraction is CPU-heavy enough that
    # running several concurrently starves the box rather than finishing any of them faster.
    - queues: "rulebook_imports"
      threads: 1
      processes: 1
      polling_interval: 1.0

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
