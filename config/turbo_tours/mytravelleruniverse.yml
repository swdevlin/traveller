journeys:
  onboarding:
    - name: sectors_view
      target: sectors-view
      title: "Sectors"
      body: "Sectors in your Traveller universe are displayed here. Click on a sector to view it."

    - name: sectors_toggle
      target: sectors-toggle
      title: "Sectors view"
      body: "Sectors can be displayed in a table or grid view."

    - name: new_sector_blank
      target: new-sector-blank
      title: "Create a new sector"
      body: "Create a blank sector. Use this option if you are homebrewing a sector and do not want any data from Charted Space or from the Deepnight Revelation campaign."

    - name: new_sector_import
      target: new-sector-import
      title: "Import a new import"
      body: "Create a blank sector by importing data from charted space (from TravellerMap) or from the Deepnight Revelation campaign."

    - name: nav_search
      target: nav-search
      title: "Search"
      body: "Search for planets, subsectors, or sectors"

    - name: nav_jumps
      target: nav-jumps
      title: "Jumps"
      body: "Use Jumps to track your player's jumps. Jumps are displayed on the maps."

    - name: nav_starmap
      target: nav-starmap
      title: "Starmap"
      body: "Starmap displays a full starmap, similar to TravellerMap. Players can access the map URL. For exploration campaigns, you can limit the data displayed to players via the survey index of systems."

    - name: nav_route
      target: nav-route
      title: "Route"
      body: "Plot a route between two systems. Routes can be saved and rendered on maps."

    - name: nav_resources
      target: nav-resources
      title: "Resources"
      body: "Reference displays a partial index of Traveller books (very much a work in progress). Traveller Wiki and Traveller Map jump to external sites — Traveller Map will be centered on the sector you're viewing, if it's in charted space."

    - name: nav_campaign
      target: nav-campaign
      title: "Campaign settings"
      body: "One of the first things you should do is set up your campaign settings. You can also configure global data such as allegiances, bases, regions."

    - name: nav_theme
      target: nav-theme
      title: "Theme"
      body: "Choose your UI theme. Maybe the most important setting of all."

  sector_new:
    - name: sector_name
      target: sector-name
      title: "Sector designation"
      body: "Use the dice button to generate a random name. Use the language button to choose the language used for name generation."

    - name: sector_coordinates
      target: sector-coordinates
      title: "Imperial coordinates"
      body: "The sector's position in the Imperial grid. X increases coreward, Y increases spinward. Each sector occupies a unique position."

    - name: sector_density
      target: sector-density
      title: "Star system density"
      body: "The chance that each parsec holds a star system. Standard is 50%. Choose a lower density for frontier regions and rifts."

    - name: sector_max_tech_level
      target: sector-max-tech-level
      title: "Maximum tech level"
      body: "The highest tech level any generated system can have. Defaults to 15. When setting each subsector separately, every subsector has its own value."

    - name: sector_settled
      target: sector-settled
      title: "Settled space"
      body: "Enable this for a sector in known space. Populated systems will be generated so the sectors are inhabited. Leave it off for unsettled exploration regions."

    - name: sector_systems_known
      target: sector-systems-known
      title: "Systems known"
      body: "Enable this if the players already have the data for these systems (survey index 10). Leave it off for exploration, where each system must be surveyed before its details are available (survey index 3)."

    - name: sector_creation_mode
      target: sector-creation-mode
      title: "Creation method"
      body: "Choose how the subsectors are set up. Same for every subsector applies one set of choices to the whole sector. Set each subsector separately lets you name each one and give it its own density, settled space and systems known. T5 import seeds the subsectors from a T5 Tab Delimited file."

    - name: sector_populate
      target: sector-populate
      title: "Populate subsectors"
      body: "Generate the star systems for every subsector as soon as it has been created. Leave it off to review or edit the build plans first."

  sectors:
    - name: sector_coordinates
      target: sector-coordinates
      title: "Coordinates"
      body: "Every sector has an X and Y coordinate. These are used to position the sectors in space."

    - name: public_map_link
      target: public-map-link
      title: "Public Map"
      body: "Copy a URL to the sector map. The URL can be accessed even if the viewer is not logged in. Use this for embedding maps in external systems, such as Obsidian or your own website."

    - name: sector_map
      target: sector-map
      title: "Sector Map"
      body: "Open the sector map in a new browser tab. The map is interactive. Click on a system to view its details."

    - name: sector_poster
      target: sector-poster
      title: "Poster"
      body: "Generate a poster map PDF for the sector. This is suitable for sending to a print shop."

    - name: sector_populate
      target: sector-populate
      title: "Populate"
      body: "Generate star systems for the sector using the rules in the World Builder's Handbook. Any existing data will be replaced."

    - name: sector_clear
      target: sector-clear
      title: "Clear"
      body: "Use this button to clear out all generated data and start again. The sector and its subsectors are retained."

    - name: sector_delete
      target: sector-delete
      title: "Delete"
      body: "Delete the sector and its associated data."
